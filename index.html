<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#070707">
<title>ICarDetail Verified</title>
<style>
:root{color-scheme:dark;--bg:#060606;--panel:#101012;--line:#29292e;--txt:#fff;--muted:#9999a2;--red:#e30613;--gold:#d2ad62;--green:#72df9d;--shadow:0 28px 90px rgba(0,0,0,.48)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(circle at 12% 0%,rgba(227,6,19,.17),transparent 31%),radial-gradient(circle at 88% 5%,rgba(210,173,98,.10),transparent 28%),linear-gradient(180deg,#050505,#0a0a0b)}.shell{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid #232326;border-radius:22px;background:rgba(12,12,14,.90);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;object-fit:contain}.brand strong{display:block;font-size:18px;letter-spacing:.5px}.brand span{display:block;margin-top:3px;font-size:9px;color:#777;letter-spacing:2px;font-weight:900}.verified{border:1px solid rgba(210,173,98,.5);background:rgba(210,173,98,.07);color:#e5c987;border-radius:999px;padding:9px 12px;font-size:9px;font-weight:950;letter-spacing:1px}.hero{position:relative;overflow:hidden;margin-top:18px;padding:30px;border:1px solid #27272a;border-radius:30px;background:linear-gradient(135deg,rgba(18,18,20,.97),rgba(10,10,11,.98));box-shadow:var(--shadow)}.hero:after{content:"ICARDETAIL";position:absolute;right:-18px;bottom:-15px;font-size:92px;font-weight:950;letter-spacing:-5px;color:rgba(255,255,255,.018);pointer-events:none}.kicker{font-size:9px;font-weight:950;letter-spacing:2.2px;color:#ff737c}.hero h1{margin:10px 0 0;font-size:clamp(36px,7vw,70px);line-height:.94;letter-spacing:-2.5px}.hero p{max-width:720px;margin:15px 0 0;color:#aaaab3;font-size:14px;line-height:1.75}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}button,.cert-open{appearance:none;border:0;cursor:pointer;border-radius:14px;padding:12px 15px;font:inherit;font-size:11px;font-weight:900;letter-spacing:.4px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--red);color:#fff}.secondary{background:#171719;border:1px solid #303034;color:#fff}.gold{background:#1d1911;border:1px solid #6d562a;color:#e7ca89}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:17px;border-top:1px solid #27272a}.tags span{padding:7px 9px;border-radius:999px;background:#121214;border:1px solid #242427;color:#8b8b94;font-size:8px;font-weight:900;letter-spacing:.8px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.card{border:1px solid var(--line);border-radius:24px;background:rgba(15,15,17,.95);padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.25)}.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.label{font-size:8px;font-weight:950;letter-spacing:1.6px;color:#71717a}.card h2{margin:7px 0 0;font-size:24px}.plate{padding:9px 12px;background:#fff;color:#111;border-radius:8px;border:3px solid #d9d9dc;font-size:16px;font-weight:950;letter-spacing:1.3px}.metrics,.info{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.metric,.item{padding:13px;border:1px solid #252528;border-radius:15px;background:#131315}.metric small,.item small{display:block;color:#71717a;font-size:7px;font-weight:950;letter-spacing:1px;text-transform:uppercase}.metric b,.item b{display:block;margin-top:7px;font-size:12px}.sealcard{background:linear-gradient(145deg,rgba(31,26,17,.96),rgba(14,13,12,.98));border-color:#4e4025}.seal{width:132px;height:132px;margin:6px auto 0;border-radius:50%;border:4px double var(--gold);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#d9b96f;transform:rotate(-4deg)}.seal span{font-size:9px;font-weight:950;letter-spacing:1.6px}.seal strong{margin:6px 0;color:#fff;font-size:19px}.seal small{font-size:7px;font-weight:950;letter-spacing:1.2px}.sealcopy{text-align:center;margin-top:16px;color:#a3977d;font-size:11px;line-height:1.65}.section{margin-top:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.sectionhead h3{margin:0;font-size:14px}.count{min-width:29px;height:29px;border-radius:10px;background:#171719;border:1px solid #29292d;display:grid;place-items:center;font-size:10px;font-weight:950;color:#aaa}.certs{display:grid;gap:14px}.cert{position:relative;overflow:hidden;border:1px solid #2b2b2f;border-radius:24px;background:linear-gradient(145deg,#121214,#0d0d0f);padding:20px}.cert-clickable{cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.cert-clickable:hover{transform:translateY(-1px);border-color:#66512d;box-shadow:0 16px 42px rgba(0,0,0,.22)}.cert-clickable:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.cert:after{content:"VERIFIED";position:absolute;right:-12px;bottom:-14px;font-size:58px;font-weight:950;color:rgba(227,6,19,.025);transform:rotate(-8deg);pointer-events:none}.certtop{display:flex;justify-content:space-between;gap:14px}.date{color:#777;font-size:9px;font-weight:900;letter-spacing:.7px}.cert h4{margin:7px 0 3px;font-size:20px}.certno{color:#ff6670;font-size:9px;font-weight:950}.mini{padding:8px 10px;border-radius:999px;border:1px solid #5c4a28;background:#1b1710;color:#d5b36b;font-size:7px;font-weight:950;letter-spacing:.8px;height:max-content}.sub{margin-top:16px}.subt{font-size:8px;font-weight:950;letter-spacing:1.3px;color:#777}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{padding:8px 10px;border-radius:999px;background:#171719;border:1px solid #2c2c30;color:#c4c4ca;font-size:9px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photo{overflow:hidden;border-radius:14px;border:1px solid #28282c;background:#111}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.photo span{display:block;padding:7px 9px;color:#8d8d95;font-size:7px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.score{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin-top:14px;padding:14px;background:#111;border:1px solid #29292c;border-radius:17px}.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:5px solid #2b2b2e;background:#0b0b0c;font-size:21px;font-weight:950}.score p{margin:5px 0 0;color:#797982;font-size:9px;line-height:1.5}.cert-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.cert-open{background:#1d1911;border:1px solid #6d562a;color:#e7ca89}.empty{padding:24px;border:1px dashed #2c2c30;border-radius:20px;text-align:center;color:#777;font-size:11px}.footer{margin-top:22px;padding:18px;border-top:1px solid #242427;color:#686870;display:flex;justify-content:space-between;gap:18px;font-size:9px;line-height:1.6}.loader{min-height:68vh;display:grid;place-items:center;text-align:center}.spinner{width:38px;height:38px;border:3px solid #28282c;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.error{max-width:620px;margin:80px auto;padding:24px;border:1px solid #49242a;background:#170d0f;border-radius:22px;text-align:center}.error h2{margin:0;color:#ff6b75}.error p{color:#aaa;line-height:1.6}@media(max-width:820px){.grid{grid-template-columns:1fr}.metrics,.info{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(2,1fr)}.hero{padding:24px 18px}.hero h1{font-size:42px}}@media(max-width:480px){.shell{width:min(100% - 18px,1120px)}.brand strong{font-size:15px}.verified{font-size:7px;padding:8px}.metrics,.info{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr 1fr}.card{padding:16px}.certtop{flex-direction:column}}@page{size:A4;margin:10mm}@media print{body{background:#fff;color:#111}.shell{width:100%;padding:0}.top,.hero,.card,.cert{box-shadow:none;background:#fff!important;color:#111!important;border-color:#ddd!important}.actions,.cert-actions{display:none!important}.hero:after,.cert:after{display:none}.hero p,.label,.date,.metric small,.item small,.footer,.sealcopy,.score p{color:#666!important}.verified,.mini{color:#745a25!important;background:#fff9eb!important}.seal strong,.hero h1,.card h2,.cert h4,.metric b,.item b{color:#111!important}.cert{break-inside:avoid;page-break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="shell"><div class="loader"><div><div class="spinner"></div><strong>A preparar o registo ICarDetail Verified…</strong></div></div></div></div>
<script>
(function(){
'use strict';
const API='https://ntdymjgsekactldhvhto.supabase.co/functions/v1/vehicle-passport-share';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>/^https:\/\//i.test(String(v||''))?String(v):'';
const fmtDate=v=>{if(!v)return'Não registada';const d=new Date(v);return isNaN(d.getTime())?esc(v):new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)};
const fmtKm=v=>{const n=Number(v);return(v===null||v===undefined||v===''||!Number.isFinite(n))?'Não registada':new Intl.NumberFormat('pt-PT').format(n)+' quilómetros'};
function certificateHref(token,id){const u=new URL(location.origin+location.pathname);u.searchParams.set('token',token);if(id)u.searchParams.set('certificate',id);return u.toString()}
function scoreOf(c){const raw=c?.care_score??c?.careScore??c?.score;if(raw==null)return null;if(typeof raw==='number')return Math.max(0,Math.min(100,Math.round(raw)));if(typeof raw==='object'){const a=Object.values(raw).map(Number).filter(Number.isFinite);if(a.length)return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}return null}
function photoHtml(p){const u=safeUrl(p?.url||p?.signed_url||p?.signedUrl);if(!u)return'';const l=p?.fase||p?.phase||p?.descricao||'Fotografia';return`<div class="photo"><img loading="lazy" src="${esc(u)}" alt="${esc(l)}"><span>${esc(String(l).toUpperCase())}</span></div>`}
function certHtml(c,token,certificateOnly){const products=Array.isArray(c?.products)?c.products:[];const photos=Array.isArray(c?.photos)?c.photos:[];const score=scoreOf(c);const prod=products.length?`<div class="chips">${products.map(p=>`<span class="chip">${esc((p.nome||p.name||p.produto||p.referencia||'Produto')+(p.quantidade!=null?' · '+p.quantidade:'')+(p.unidade?' '+p.unidade:''))}</span>`).join('')}</div>`:'<div class="empty">Sem produtos detalhados registados.</div>';const pics=photos.map(photoHtml).filter(Boolean).join('');const scoreBlock=score==null?'':`<div class="score"><div class="ring">${esc(score)}</div><div><strong>ICarDetail Care Score</strong><p>Avaliação estética associada a este serviço. Não representa diagnóstico mecânico.</p></div></div>`;const href=certificateHref(token,c.id);const openButton=certificateOnly?'':`<div class="cert-actions"><a class="cert-open" href="${esc(href)}">ABRIR CERTIFICADO</a></div>`;const cardAttrs=certificateOnly?'':` data-cert-url="${esc(href)}" role="link" tabindex="0"`;return`<article class="cert${certificateOnly?'':' cert-clickable'}"${cardAttrs}><div class="certtop"><div><div class="date">${fmtDate(c.data||c.concluida_em||c.entregue_em||c.entrada_em)}</div><h4>${esc(c.servico||'Serviço certificado')}</h4><div class="certno">${esc(c.numero_certificado||c.certificate_number||c.numero_ot||'ICD-CERTIFICADO')}</div></div><span class="mini">ICARDETAIL VERIFIED</span></div><div class="info"><div class="item"><small>Ordem de trabalho</small><b>${esc(c.numero_ot||'—')}</b></div><div class="item"><small>Técnico</small><b>${esc(c.tecnico||'Equipa ICarDetail')}</b></div><div class="item"><small>Estado</small><b>${esc(c.estado==='entregue'?'Entregue':'Pronto')}</b></div><div class="item"><small>Quilometragem</small><b>${fmtKm(c.quilometragem_servico)}</b></div></div>${scoreBlock}<div class="sub"><div class="subt">PRODUTOS UTILIZADOS</div>${prod}</div><div class="sub"><div class="subt">REGISTO FOTOGRÁFICO</div>${pics?`<div class="photos">${pics}</div>`:'<div class="empty">Sem fotografias associadas a este certificado.</div>'}</div>${openButton}</article>`}
function render(data,token,certificateId){const vehicle=data.vehicle||{};const all=Array.isArray(data.certificates)?data.certificates:[];const certs=certificateId?all.filter(c=>String(c.id)===String(certificateId)):all;const certOnly=!!certificateId;const title=certOnly?'Certificado Digital':'Passaporte Digital';const model=[vehicle.marca||vehicle.make,vehicle.modelo||vehicle.model].filter(Boolean).join(' ')||'Viatura certificada';const year=vehicle.ano||vehicle.year||'—';const km=vehicle.quilometragem??vehicle.mileage;const plate=vehicle.matricula||vehicle.plate||'—';const current=location.href;const latest=certs[0]||null;const browserButton=certOnly?'VOLTAR AO PASSAPORTE':'ABRIR CERTIFICADO';document.title=title+' · ICarDetail Verified';document.getElementById('app').innerHTML=`<div class="shell"><div class="top"><div class="brand"><img src="https://icardetail.pt/logo-icon.png" alt="ICarDetail"><div><strong>ICARDETAIL</strong><span>MOTORSPORT</span></div></div><div class="verified">ICARDETAIL VERIFIED</div></div><section class="hero"><div class="kicker">${certOnly?'DIGITAL SERVICE CERTIFICATE':'DIGITAL VEHICLE HISTORY'}</div><h1>${title}</h1><p>${certOnly?'Certificado individual, verificável e associado ao histórico ICarDetail.':'Histórico digital verificável de cuidados e serviços realizados pela ICarDetail.'} Este acesso público não apresenta nome, telefone, email, custos, margens ou notas internas.</p><div class="actions"><button class="primary" id="print">GERAR PDF</button><button class="secondary" id="share">PARTILHAR</button><button class="gold" id="browser">${browserButton}</button></div><div class="tags"><span>SECURE</span><span>TRACEABLE</span><span>REVOCABLE</span><span>NO OWNER PII</span></div></section><div class="grid"><section class="card"><div class="cardhead"><div><div class="label">VIATURA</div><h2>${esc(model)}</h2></div><div class="plate">${esc(plate)}</div></div><div class="metrics"><div class="metric"><small>Ano</small><b>${esc(year)}</b></div><div class="metric"><small>Quilometragem atual</small><b>${fmtKm(km)}</b></div><div class="metric"><small>Certificados</small><b>${esc(certs.length)}</b></div><div class="metric"><small>Estado</small><b>Verificado</b></div></div></section><section class="card sealcard"><div class="seal"><span>ICARDETAIL</span><strong>VERIFIED</strong><small>CERTIFIED HISTORY</small></div><div class="sealcopy">Registo digital emitido a partir do histórico ICarDetail e protegido por acesso público revogável.</div></section></div><section class="section"><div class="sectionhead"><h3>${certOnly?'CERTIFICADO':'HISTÓRICO CERTIFICADO'}</h3><span class="count">${esc(certs.length)}</span></div><div class="certs">${certs.length?certs.map(c=>certHtml(c,token,certOnly)).join(''):'<div class="empty">Não existem certificados disponíveis para este acesso.</div>'}</div></section><footer class="footer"><div><strong>ICarDetail Motorsport</strong><br>Registo digital verificável</div><div>O Care Score, quando apresentado, é uma avaliação estética e não substitui diagnóstico mecânico, inspeção ou peritagem.</div></footer></div>`;$('#print').onclick=()=>window.print();$('#share').onclick=()=>navigator.share?navigator.share({title:'ICarDetail '+title,text:'ICarDetail Verified',url:current}).catch(()=>{}):prompt('Partilhar ligação:',current);$('#browser').onclick=()=>{if(certOnly){location.href=certificateHref(token,'');return}if(!latest){alert('Ainda não existe nenhum certificado disponível.');return}location.href=certificateHref(token,latest.id)};document.querySelectorAll('.cert-clickable').forEach(card=>{const open=()=>{const target=card.getAttribute('data-cert-url');if(target)location.href=target};card.addEventListener('click',event=>{if(event.target.closest('a,button'))return;open()});card.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('a,button')){event.preventDefault();open()}})}) }
function fail(msg){document.getElementById('app').innerHTML=`<div class="shell"><div class="error"><h2>Não foi possível abrir este registo</h2><p>${esc(msg||'Ligação inválida, expirada ou revogada.')}</p></div></div>`}
const q=new URLSearchParams(location.search),token=q.get('token')||'',certificateId=q.get('certificate')||'';if(!token){fail('Token público em falta.');return}const url=API+'?token='+encodeURIComponent(token)+'&format=json'+(certificateId?'&certificate='+encodeURIComponent(certificateId):'');fetch(url,{headers:{Accept:'application/json'},cache:'no-store'}).then(async r=>({ok:r.ok,status:r.status,data:await r.json()})).then(x=>{if(!x.ok)throw new Error(x.data?.error||('HTTP '+x.status));render(x.data,token,certificateId)}).catch(err=>fail(err?.message||String(err)));
})();
</script>
</body>
</html>
